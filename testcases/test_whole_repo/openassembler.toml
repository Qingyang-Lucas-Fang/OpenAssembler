[application]
frontend = "torch"
entrypoint = "train_transformer.py"
args = ["--device", "cuda", "--steps", "4", "--batch-size", "2", "--block-size", "16", "--d-model", "32", "--nhead", "4", "--num-layers", "1", "--dropout", "0", "--new-tokens", "0", "--timing-warmup", "2", "--profile-steps", "4"]
seed = 7
torch = "2.7.1"
build_backend = "modal"
gpu = "A100-40GB"
budget = 900
job_timeout = 600
verification = "state"
rtol = 0.0001
atol = 0.00001
state_rtol = 0.001
state_atol = 0.001
